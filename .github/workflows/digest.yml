name: daily-digest

on:
  schedule:
    # 04:23 UTC = 07:23 МСК: внутри окна off-peak DeepSeek (пик — 01–04 и 06–10 UTC по будням, вдвое дороже).
    # Cron в Actions опаздывает на 5–60 мин — запас до 06:00 есть.
    - cron: "23 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .

      # State (SQLite) lives in the Actions cache: restore the latest, save a new one each run.
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: splat-digest run
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          DEEP_READ: ${{ vars.DEEP_READ }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          MIN_RELEVANCE: ${{ vars.MIN_RELEVANCE }}
          SOURCES: ${{ vars.SOURCES }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: state-${{ github.run_id }}
