name: daily-digest

on:
  schedule:
    # 04:23 UTC = 07:23 МСК: внутри окна off-peak DeepSeek (пик — 01–04 и 06–10 UTC по будням, вдвое дороже).
    # Cron в Actions опаздывает на 5–60 мин — запас до 06:00 есть.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "seed — первый запуск (запомнить всё старое без отправки); dry-run — дайджест в лог; run — отправить"
        type: choice
        options: [run, seed, dry-run, check-sources]
        default: run

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04   # закреплено: ubuntu-latest переезжает на 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .

      # State (SQLite) lives in the Actions cache: restore the latest, save a new one each run.
      - uses: actions/cache/restore@v5
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: state-

      # По расписанию — всегда run; при ручном запуске — выбранная команда.
      - run: splat-digest ${{ inputs.command || 'run' }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          DEEP_READ: ${{ vars.DEEP_READ }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          MIN_RELEVANCE: ${{ vars.MIN_RELEVANCE }}
          SOURCES: ${{ vars.SOURCES }}

      # Сохраняем только если база есть: check-sources её не создаёт. Пустой кэш нельзя сохранять —
      # он стал бы «самым свежим», и следующий run забыл бы всё отправленное.
      - uses: actions/cache/save@v5
        if: always() && hashFiles('data/state.db') != ''
        with:
          path: data
          key: state-${{ github.run_id }}
