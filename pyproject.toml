[project]
name = "splat-digest"
version = "0.1.0"
description = "Daily Telegram digest of 3D Gaussian Splatting papers scored by DeepSeek"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
splat-digest = "splat_digest.main:cli"

[tool.setuptools.packages.find]
include = ["splat_digest*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
